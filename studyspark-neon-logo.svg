<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="sparkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <rect width="500" height="500" fill="#050816"/>

  <circle
    cx="250"
    cy="180"
    r="120"
    fill="#1E3A8A"
    opacity="0.25"
    filter="url(#glow)"
  />

  <path
    d="M140 120 Q140 95 165 95 H225 V280 H165 Q140 280 140 255 Z"
    fill="url(#bookGradient)"
    filter="url(#glow)"
  />

  <path
    d="M360 120 Q360 95 335 95 H275 V280 H335 Q360 280 360 255 Z"
    fill="url(#bookGradient)"
    filter="url(#glow)"
  />

  <path
    d="M250 45 L285 135 L250 118 L215 135 Z"
    fill="url(#sparkGradient)"
    filter="url(#glow)"
  />

  <circle cx="210" cy="70" r="5" fill="#FACC15"/>
  <circle cx="290" cy="75" r="5" fill="#F97316"/>

  <circle
    cx="250"
    cy="185"
    r="42"
    fill="#FFFFFF"
    opacity="0.95"
    filter="url(#glow)"
  />

  <polygon
    points="238,165 275,185 238,205"
    fill="#2563EB"
  />

  <text
    x="250"
    y="390"
    text-anchor="middle"
    font-family="Arial"
    font-size="52"
    font-weight="800"
    fill="#E2E8F0"
  >
    Study
    <tspan fill="#FACC15">Spark</tspan>
  </text>

</svg>